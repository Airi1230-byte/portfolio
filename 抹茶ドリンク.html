                <p>抹茶ラテ</p>
                <p>抹茶にミルクを加えた、まろやかで飲みやすいドリンクである。
                    抹茶の苦味がミルクの甘さによってやわらぎ、初めて抹茶を飲む人でも楽しみやすい。</p>
            </div>
            <div class="item">
                <img src="アイス抹茶.jpg" alt="">
                <p>アイス抹茶</p>
                <p>抹茶を水で溶いた、シンプルでさっぱりとしたドリンクである。
                    甘さがなく、抹茶本来の香りや苦味をそのまま味わうことができる。</p>
            </div>
            <div class="item">
                <img src="抹茶フラッペ.png" alt="">
                <p>抹茶フラッペ</p>
                <p>抹茶を使った冷たいフラッペタイプのドリンクである。
                    甘みが強く、シャリシャリとした食感が特徴で、デザート感覚で楽しめる。</p>
